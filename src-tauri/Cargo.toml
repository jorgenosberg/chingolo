[package]
name = "chingolo"
version = "0.4.2"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chingolo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v7"] }
tokio-util = "0.7.20"
keyring = "4.2.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "query"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.26"
specta-typescript = "0.0.13"
pdfium-render = "0.9.5"
sha2 = "0.11.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
regex = "1.13.1"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.1"
tauri-plugin-updater = "2.14.1"
log = "0.4.35"
fastembed = { version = "=7.6.0", default-features = false, features = ["ort-download-binaries-rustls-tls"] }

# PP-OCR text, layout and tables. Vendored for the ort rc.15 port (see third_party/README.md)
image = { version = "0.25.10", default-features = false, features = ["png"] }
oar-ocr = { version = "=0.10.2", default-features = false, features = ["simd"] }

# Apple Vision, the second reader for table cells (macOS only, like the rest of the app)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSArray", "NSError", "NSString", "NSDictionary", "NSObject", "NSRange", "NSProcessInfo"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes"] }

[patch.crates-io]
oar-ocr = { path = "third_party/oar-ocr" }
oar-ocr-core = { path = "third_party/oar-ocr-core" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = "debuginfo"

[dev-dependencies]
tempfile = "3.27.0"
# parity test against the built-in model definition (ignored test, needs network)
fastembed = { version = "=7.6.0", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
