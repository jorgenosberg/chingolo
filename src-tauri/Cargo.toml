[package]
name = "chingui"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chingui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1.29.0", features = ["v7"] }
tokio-util = "0.7.20"
keyring = "4.2.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "query"] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.26"
specta-typescript = "0.0.13"
pdfium-render = "0.9.5"
sha2 = "0.11.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
regex = "1.13.1"
tauri-plugin-dialog = "2.8.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
